# gitleaks config: the default rules, plus one narrow allowlist.
[extend]
useDefault = true

# Two kinds of committed hash look like keys to the generic-api-key rule:
# - dataset samples: Datadog's aggreg_key / alert_cycle_key, 32-hex hashes of
#   synthetic monitor ids;
# - recorded model responses: "key" is the SHA-256 of the request (64 hex).
# Ignore a finding only when it is in one of those files AND the value is
# exactly such a hex hash, so anything else there (or anywhere) is still caught.
[allowlist]
description = "Synthetic hashes in dataset samples and model-response cassettes"
condition = "AND"
paths = ['''^dataset/v1/samples/[a-z0-9_-]+\.json$''', '''^cassettes/[a-z0-9_.-]+\.jsonl$''']
regexes = ['''^[0-9a-f]{32}$''', '''^[0-9a-f]{64}$''']
