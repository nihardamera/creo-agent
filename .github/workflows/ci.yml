name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Committed dataset: manifest hashes, config hashes and every label.
      - run: uv run python -m creo.dataset.validate

  # Replays a fixed 120-case held-out subset against the recorded model
  # responses and compares with eval/ci_baseline.json (see creo/eval/gate.py).
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m creo.eval.gate check

  # The stack a stranger runs: build, start, replay alerts end to end.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: mkdir -p var && chmod 777 var
      - run: docker compose run --rm replayer python -m creo.replayer --split dev --n 12 --rate 2 --auto-approve --timeout 240 --report /data/replay-report.json
      - run: python3 -c "import json,sys; s=json.load(open('var/replay-report.json'))['summary']; print(s); sys.exit(s['finished'] != s['cases'])"
      - if: failure()
        run: docker compose logs --tail 80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
